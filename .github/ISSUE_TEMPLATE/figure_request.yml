name: Figure or feature request
description: Ask for a new example figure, a new part or helper in the kit, a new check, or a change to how the skill works.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Schematic explains a concept by drawing its own structure (a matrix, a tree, a graph, a queue, a surface) exactly, with every element at its true count. It is not a chart library, and an idea best explained by a machine metaphor belongs in Anatomy.
  - type: dropdown
    id: request
    attributes:
      label: What are you asking for?
      options:
        - A new example figure
        - A new part or helper in the kit
        - A new check or script
        - A change to the skill's instructions
        - Something else
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: For a figure, name the concept it should explain, its true sizes (shapes, counts, values) and the operation to show. For anything else, describe the change.
      placeholder: A hash table with 8 buckets and separate chaining; insert 12 keys, show the collisions, then resize to 16 buckets.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of figure
      options:
        - SVG
        - SVG + WebGL
        - 3D (beta)
        - Not sure
        - Not about a figure
  - type: textarea
    id: why
    attributes:
      label: Why it is worth adding
      description: What it would teach, or what you could not do without it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues.
          required: true
        - label: I read the Limits section of the README.
          required: true
